<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>个人主页</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <!--导航栏-->
    <nav class="navbar">
        <div class="nav-name">我的个人主页</div>
        <div class="nav-links">
            <a href="#home">首页</a>
            <a href="#edu">教育背景</a>
            <a href="#project">项目经历</a>
            <a href="#skill">技能</a>
            <a href="#contact">联系我</a>
        </div>
    </nav>

    <!--首屏-->
    <section id="home" class="hero">
        <div class="hero-text">
            <h1>黄蓉</h1>
            <p class="desc">一句话定位，例如：计算机专业应届本科生</p>
            <div class="hero-buttons">
                <a href="#project" class="btn">查看项目</a>
                <a href="#contact" class="btn">联系我</a>
            </div>
        </div>
        <div class="avatar">头像占位</div>
    </section>

    <!--教育背景-->
    <section id="edu" class="section">
        <h2>教育背景</h2>
        <div class="content-card">
            <p>学校名称 | 专业 | 入学-毕业时间</p>
            <p>亮点描述</p>
        </div>
    </section>

    <!--项目经历-->
    <section id="project" class="section">
        <h2>项目经历</h2>
        <div class="project-container">
            <div class="card">
                <h3>项目1名称</h3>
                <p>项目描述</p>
                <div class="tags">HTML CSS JS</div>
            </div>
            <div class="card">
                <h3>项目2名称</h3>
                <p>项目描述</p>
                <div class="tags">Python Git</div>
            </div>
            <div class="card">
                <h3>项目3名称</h3>
                <p>项目描述</p>
                <div class="tags">MySQL</div>
            </div>
        </div>
    </section>

    <!--技能标签-->
    <section id="skill" class="section">
        <h2>技能</h2>
        <div class="skill-tags">
            <span class="tag">HTML</span>
            <span class="tag">CSS</span>
            <span class="tag">JavaScript</span>
            <span class="tag">Python</span>
            <span class="tag">Git</span>
            <span class="tag">MySQL</span>
        </div>
    </section>

    <!--联系方式-->
    <section id="contact" class="section">
        <h2>联系方式</h2>
        <p>邮箱：861642959@qq.com</p>
        <p>GitHub：<a href="https://github.com/demo-user">github.com/demo-user</a></p>
    </section>

    <footer>
        <p>本页由 AI 辅助开发 · 2026</p>
    </footer>
    <script src="script.js"></script>
</body>
</html>
